# Backup and PITR restore manifests for static credentials backward compatibility test
---
# Backup for pxc-static
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBClusterBackup
metadata:
  name: static-backup
  namespace: portal
spec:
  pxcCluster: pxc-static
  storageName: s3-backup
---
# DR cluster for PITR restore (static credentials)
apiVersion: v1
kind: Secret
metadata:
  name: pxc-static-dr-secrets
  namespace: portal
type: Opaque
stringData:
  root: "rootpass123"
  xtrabackup: "backuppass123"
  monitor: "monitorpass123"
  clustercheck: "clustercheckpass123"
  operator: "operatorpass123"
  replication: "replicationpass123"
---
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBCluster
metadata:
  name: pxc-static-dr
  namespace: portal
spec:
  crVersion: "1.18.0"
  secretsName: pxc-static-dr-secrets
  allowUnsafeConfigurations: true
  initContainer:
    image: ghcr.io/gmautner/pxc-operator:K8SPS-632-test
  pxc:
    size: 1
    image: percona/percona-xtradb-cluster:8.0.36-28.1
    resources:
      requests:
        memory: 512M
        cpu: 300m
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 2Gi
  haproxy:
    enabled: true
    size: 1
    image: percona/haproxy:2.8.5
    resources:
      requests:
        memory: 128M
        cpu: 100m
  backup:
    image: percona/percona-xtrabackup:8.0.35-34.1
    storages:
      s3-backup:
        type: s3
        verifyTLS: true
        s3:
          bucket: lwsa-idp-testbed-dev-backup-eks-06-ttzun9n9/pxc/portal-static-dr/backup
          credentialsSecret: static-backup-creds
          region: us-east-2
---
# PITR restore with direct S3 reference (static credentials)
# NOTE: Update the destination path with actual backup timestamp
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBClusterRestore
metadata:
  name: static-dr-restore
  namespace: portal
spec:
  pxcCluster: pxc-static-dr
  backupSource:
    # Update this path with actual backup destination
    destination: s3://lwsa-idp-testbed-dev-backup-eks-06-ttzun9n9/pxc/portal-static/backup/pxc-static-2025-12-25-21:25:15-full
    s3:
      bucket: lwsa-idp-testbed-dev-backup-eks-06-ttzun9n9/pxc/portal-static/backup
      credentialsSecret: static-backup-creds
      region: us-east-2
    verifyTLS: true
  pitr:
    type: latest
    backupSource:
      s3:
        bucket: lwsa-idp-testbed-dev-backup-eks-06-ttzun9n9/pxc/portal-static/pitr
        credentialsSecret: static-backup-creds
        region: us-east-2
      verifyTLS: true

