# Backup and PITR restore manifests for session token test
---
# Backup for pxc-clean
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBClusterBackup
metadata:
  name: backup-for-restore
  namespace: portal
spec:
  pxcCluster: pxc-clean
  storageName: s3-backup
---
# DR cluster for PITR restore (session token)
apiVersion: v1
kind: Secret
metadata:
  name: pxc-dr-secrets
  namespace: portal
type: Opaque
stringData:
  root: "rootpass123"
  xtrabackup: "backuppass123"
  monitor: "monitorpass123"
  clustercheck: "clustercheckpass123"
  operator: "operatorpass123"
  replication: "replicationpass123"
---
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBCluster
metadata:
  name: pxc-dr
  namespace: portal
spec:
  crVersion: "1.18.0"
  secretsName: pxc-dr-secrets
  allowUnsafeConfigurations: true
  
  initContainer:
    image: ghcr.io/gmautner/pxc-operator:K8SPS-632-test
  
  pxc:
    size: 1
    image: percona/percona-xtradb-cluster:8.0.36-28.1
    resources:
      requests:
        memory: 512M
        cpu: 300m
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 2Gi

  haproxy:
    enabled: true
    size: 1
    image: percona/haproxy:2.8.5
    resources:
      requests:
        memory: 128M
        cpu: 100m

  backup:
    image: percona/percona-xtrabackup:8.0.35-34.1
    storages:
      s3-backup:
        type: s3
        verifyTLS: true
        s3:
          bucket: lwsa-idp-testbed-dev-backup-eks-06-ttzun9n9/pxc/portal-dr/backup
          credentialsSecret: portal-blueprint-backup-creds
          region: us-east-2
      s3-pitr:
        type: s3
        verifyTLS: true
        s3:
          bucket: lwsa-idp-testbed-dev-backup-eks-06-ttzun9n9/pxc/portal-dr/pitr
          credentialsSecret: portal-blueprint-backup-creds
          region: us-east-2
---
# PITR restore with direct S3 reference (DR scenario)
# NOTE: Update the destination path with actual backup timestamp
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBClusterRestore
metadata:
  name: dr-pitr-restore
  namespace: portal
spec:
  pxcCluster: pxc-dr
  backupSource:
    # Update this path with actual backup destination
    destination: s3://lwsa-idp-testbed-dev-backup-eks-06-ttzun9n9/pxc/portal-clean/backup/pxc-clean-2025-12-24-20:24:21-full
    s3:
      bucket: lwsa-idp-testbed-dev-backup-eks-06-ttzun9n9/pxc/portal-clean/backup
      credentialsSecret: portal-blueprint-backup-creds
      region: us-east-2
    verifyTLS: true
  pitr:
    type: latest
    backupSource:
      s3:
        bucket: lwsa-idp-testbed-dev-backup-eks-06-ttzun9n9/pxc/portal-clean/pitr
        credentialsSecret: portal-blueprint-backup-creds
        region: us-east-2
      verifyTLS: true

